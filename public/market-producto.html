<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Detalle de producto de Horus Market.">
    <title>Producto | Horus Market</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/market-producto.css">
  </head>
  <body>
    <header class="site-header">
      <div class="header-content">
        <a class="brand" href="/market.html" aria-label="Volver a Horus Market">
          <span class="brand-mark" aria-hidden="true">H</span>
          <span>
            <strong>Horus Group</strong>
            <span class="brand-section">Market</span>
          </span>
        </a>
        <div class="header-actions">
          <a class="cart-link" href="/market-carrito.html">Carrito (<span data-cart-count>0</span>)</a>
          <a class="back-link" href="/market.html">← Volver al Market</a>
        </div>
      </div>
    </header>

    <main class="page-content">
      <section id="status-panel" class="status-panel" role="status" aria-live="polite">
        <p class="eyebrow">Horus Market</p>
        <h1 id="status-title">Cargando producto…</h1>
        <p id="status-message">Estamos obteniendo la información del producto.</p>
      </section>

      <article id="product-detail" class="product-detail" hidden></article>
    </main>

    <footer class="site-footer">
      <p>Horus Group SRL · Market de prueba</p>
    </footer>

    <script src="js/cart.js" defer></script>
    <script src="js/market-producto.js" defer></script>
  </body>
</html>
