services:
  - type: web
    name: horus-market-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_DIALECT
        value: mysql
      - key: DB_SSL
        value: "false"
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: TRUST_PROXY
        value: "1"
